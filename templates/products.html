{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Produtos</h2>
  <form class="form-grid" method="post" action="{{ url_for('criar_produto') }}">
    <label>Nome
      <input type="text" name="name" required>
    </label>
    <label>SKU (opcional)
      <input type="text" name="sku">
    </label>
    <label>Custo variável unitário (R$)
      <input type="number" step="0.01" name="variable_cost" required>
    </label>
    <label>Preço de venda sugerido (R$)
      <input type="number" step="0.01" name="default_price" required>
    </label>
    <button type="submit" class="btn-primary full-width">Cadastrar</button>
  </form>
</section>

<section class="card">
  <h3>Lista de produtos</h3>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>SKU</th>
        <th>Custo var.</th>
        <th>Preço</th>
      </tr>
    </thead>
    <tbody>
    {% for p in products %}
      <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.sku or '' }}</td>
        <td>R$ {{ "%.2f"|format(p.variable_cost) }}</td>
        <td>R$ {{ "%.2f"|format(p.default_price) }}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
