<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Redutron | Controle de Vendas v3</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="logo-area">
      <span class="logo-r">R</span>
      <span class="logo-text">Redutron</span>
    </div>
    <nav class="menu">
      <a href="{{ url_for('index') }}">Dashboard</a>
      <a href="{{ url_for('listar_produtos') }}">Produtos</a>
      <a href="{{ url_for('listar_vendas') }}">Vendas</a>
      <a href="{{ url_for('relatorio') }}">Relatórios</a>
      <a href="{{ url_for('importar_vendas') }}">Importar</a>
    </nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-area">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
